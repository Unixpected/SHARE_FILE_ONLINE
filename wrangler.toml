name = "share-file-online"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/10 * * * *"]   # cleanup every 10 minutes (files + old log rows)

[vars]
B2_BUCKET   = "fileshare-tmp-yourname-482"
B2_ENDPOINT = "s3.us-west-004.backblazeb2.com"
B2_REGION   = "us-west-004"
# Sites allowed to call this worker. Change it with move-domain.ps1 (see MOVE_DOMAIN.md).
ALLOWED_ORIGIN = "https://fileshare.unixpected05.online,http://fileshare.unixpected05.online,https://unixpected.github.io"

# Secrets (NOT stored here). Set with:
#   npx wrangler secret put B2_KEY_ID
#   npx wrangler secret put B2_APP_KEY
#   npx wrangler secret put ADMIN_PASSWORD     <- NEW: password for /admin.html

# Rate limit: 10 upload starts per minute per IP (period must be 10 or 60)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Rate limit for likes/stars on comments: 30 per minute per IP
[[unsafe.bindings]]
name = "RATE_LIMITER_REACT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# NEW: admin login attempts: 5 per minute per IP
[[unsafe.bindings]]
name = "RATE_LIMITER_ADMIN"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# Comments / settings / logs database (Cloudflare D1).
#   npx wrangler d1 create share-comments
#   npx wrangler d1 execute share-comments --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "share-comments"
database_id = "2e3815b0-26e8-47e8-9041-af0085251963"
